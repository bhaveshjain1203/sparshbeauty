  <rect width="800" height="960" fill="url(#bgHair)"/>
  <rect x="64" y="64" width="672" height="832" rx="336" fill="#FCF9F5" fill-opacity="0.45" stroke="url(#goldLine)" stroke-width="1.6"/>
