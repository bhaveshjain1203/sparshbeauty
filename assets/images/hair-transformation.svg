  <path d="M565 250 L572 272 L594 279 L572 286 L565 308 L558 286 L536 279 L558 272 Z" fill="url(#goldLine)" opacity="0.85"/>
  <path d="M235 375 L239 390 L254 394 L239 398 L235 413 L231 398 L216 394 L231 390 Z" fill="url(#goldLine)" opacity="0.75"/>
  <text x="400" y="815" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#F6E2B8">PERMANENT HAIR STRAIGHTENING</text>
  <text x="400" y="848" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="3.5" fill="#D8C299" opacity="0.85">SILK SMOOTHING • KERATIN • MIRROR GLOSS</text>
