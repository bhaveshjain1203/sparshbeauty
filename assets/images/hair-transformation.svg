<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-label="Permanent Hair Straightening Transformation">
  <defs>
    <linearGradient id="bgHair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1719"/>
      <stop offset="60%" stop-color="#332227"/>
      <stop offset="100%" stop-color="#140F11"/>
    </linearGradient>
    <linearGradient id="silkHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C1416"/>
      <stop offset="32%" stop-color="#4A3237"/>
      <stop offset="50%" stop-color="#D7B27C"/>
      <stop offset="68%" stop-color="#3E282D"/>
      <stop offset="100%" stop-color="#181113"/>
