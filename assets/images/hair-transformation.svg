      <stop offset="0%" stop-color="#F6F0EA"/>
      <stop offset="60%" stop-color="#EDE3DA"/>
      <stop offset="100%" stop-color="#E3D5C9"/>
    </linearGradient>
    <linearGradient id="silkHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A3439"/>
      <stop offset="32%" stop-color="#6E4E55"/>
      <stop offset="50%" stop-color="#DFC4A2"/>
      <stop offset="68%" stop-color="#5B3F46"/>
