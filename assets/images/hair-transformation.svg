  <path d="M335 160 C315 340 315 540 295 755" fill="none" stroke="#F6E2B8" stroke-width="2" opacity="0.45"/>
  <path d="M400 155 C395 340 405 540 400 760" fill="none" stroke="#F6E2B8" stroke-width="2.5" opacity="0.58"/>
  <path d="M465 160 C485 340 485 540 505 755" fill="none" stroke="#F6E2B8" stroke-width="2" opacity="0.45"/>
  <!-- Mirror Shine Band -->
  <ellipse cx="400" cy="435" rx="145" ry="26" fill="#FCEAC6" opacity="0.16"/>
  <ellipse cx="400" cy="435" rx="95" ry="11" fill="#FFF3D9" opacity="0.28"/>
